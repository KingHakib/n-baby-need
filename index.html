<script>
/* ================= بنسټونه ================= */
if(!window.NBN){
 document.body.innerHTML='<div style="font-family:sans-serif;display:grid;place-items:center;min-height:100vh;background:#FAF4E8;color:#33261A;text-align:center;padding:20px"><div><h1>N Baby Need</h1><p>دا پاڼه د سرور له لاري پرانیستل کېږي.<br>په ترمینل کي: <b>node server.js</b> بیا <b>http://localhost:3000</b></p></div></div>';
 throw new Error('NBN: index.html باید د server.js له لاري پرانیستل شي.');
}
if(window.NBN_ADMIN)document.body.classList.add('admin');

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const FAD='۰۱۲۳۴۵۶۷۸۹',ROMAN=['I','II','III','IV'],LANG_NAME={ps:'پښتو',fa:'دری',en:'English'};
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>FAD.indexOf(d));
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const DB=window.NBN,CSRF=window.NBN_CSRF;
const isAdmin=()=>document.body.classList.contains('admin');
async function api(act,data,method='POST'){
 const r=await fetch('/api/'+act,{method,credentials:'same-origin',
  headers:{'Content-Type':'application/json','X-CSRF':CSRF},
  body:method==='POST'?JSON.stringify(data||{}):undefined});
 return r.json();}
function toast(msg,ok=true){const el=document.createElement('div');el.className='toast'+(ok?'':' err');
 el.innerHTML=`<svg class="ic"><use href="#${ok?'i-check':'i-x'}"/></svg><span>${msg}</span>`;
 $('#toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},3400);}
function pickImg(cb){const i=$('#file');i.onchange=()=>{const f=i.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{
  const W=Math.min(900,im.width),c=document.createElement('canvas');
  c.width=W;c.height=Math.round(im.height*W/im.width);
  c.getContext('2d').drawImage(im,0,0,W,c.height);
  try{const j=await api('upload',{data:c.toDataURL('image/jpeg',.82)});
   if(j.ok)cb(j.url);else toast('عکس پورته نه شو',false);
  }catch(e){toast('عکس پورته نه شو',false);}
 };im.src=r.result;};r.readAsDataURL(f);i.value='';};i.click();}

/* ================= حالت ================= */
const state={lang:localStorage.getItem('nbn_lang')||'ps',stage:1,cart:{},filter:'all',
 nutrient:0,edit:false,panel:null,search:'',promo:null};
const T=k=>(DB.texts[state.lang]&&DB.texts[state.lang][k])??DB.texts.en[k]??'';
const L=o=>o?(o[state.lang]||o.en||''):'';
const Ar=a=>a?(a[state.lang]||a.en||[]):[];
const brandMain=()=>state.lang==='fa'?DB.brand.nameFa:state.lang==='ps'?DB.brand.namePs:DB.brand.nameEn;
const nf=v=>String(v).replace(/\d/g,d=>state.lang==='en'?d:FAD[d]);
const cur=()=>DB.settings.currency[state.lang]||DB.settings.currency.en;
const fmt=n=>{const s=(+n||0).toLocaleString('en-US');return state.lang==='en'?s+' '+cur():nf(s).replace(/,/g,'٬')+' '+cur();};
const outOf=p=>p.stock!=null&&p.stock<=0;
const pImgs=p=>{const a=Array.isArray(p.imgs)?[...p.imgs]:[];if(p.img&&!a.includes(p.img))a.unshift(p.img);return a;};
const intlPhone=n=>{const d=String(n||'').replace(/\D/g,'');return d.startsWith('0')?'93'+d.slice(1):d.replace(/^\+/,'');};

/* ================= سیو (سرور ته) ================= */
let saveT=null;
function save(){if(!isAdmin())return;const s=$('#saveState');if(s)s.classList.add('dirty');
 clearTimeout(saveT);saveT=setTimeout(doSave,900);}
async function doSave(){const s=$('#saveState');if(!s)return;
 s.classList.remove('dirty');s.classList.add('saving');s.textContent='…';
 try{const j=await api('save',{site:DB});
  if(j.ok){s.textContent='✓';s.classList.remove('err');}else throw 0;
 }catch(e){s.textContent='✕';s.classList.add('err');}
 setTimeout(()=>{s.classList.remove('saving','err');s.textContent='ذخیره';},1400);}

/* ================= پلي کول ================= */
function applyTexts(){
 $$('[data-e]').forEach(el=>{const k=el.dataset.e;if(!k||k.includes(':'))return;
  const v=T(k);if(v)el.textContent=v;});
 $$('[data-ph]').forEach(el=>el.placeholder=T(el.dataset.ph));
 $('#trackBtn').textContent=T('track_t');
 $('#trackLink').textContent=T('track_t');}
function applyTheme(){const r=document.documentElement.style,t=DB.theme;
 r.setProperty('--paper',t.paper);r.setProperty('--card',t.card);r.setProperty('--ink',t.ink||'#33261A');
 r.setProperty('--accent',DB.stages[state.stage].color);r.setProperty('--accent-soft',DB.stages[state.stage].soft);
 r.setProperty('--clay',t.clay);r.setProperty('--radius',t.radius+'px');r.setProperty('--paper2',t.paper);
 $('.grain').style.display=t.grain?'':'none';}
function applySettings(){
 const s=DB.settings.show,map={mq:'#mq',stages:'#stages',products:'#products',promise:'#promise',nutrition:'#nutrition',stories:'#stories',care:'#care'};
 for(const k in map){const el=$(map[k]);if(el)el.style.display=s[k]?'':'none';}
 $('#barTx').textContent=DB.settings.bar[state.lang]||DB.settings.bar.en;
 $('#carePhone').textContent=nf(DB.settings.phone);
 $('#careAddr').textContent=L(DB.settings.addr)||DB.settings.addr.en;
 if(DB.settings.heroImg){$('#heroImg').src=DB.settings.heroImg;$('#heroImg').hidden=false;$('#sceneSvg').style.display='none';}
 else{$('#heroImg').hidden=true;$('#sceneSvg').style.display='';}}
function applyBrand(){
 const main=brandMain(),alt=state.lang==='en'?(DB.brand.nameFa||DB.brand.namePs):DB.brand.nameEn;
 $('#brandWord').textContent=main;$('#brandAlt').textContent=alt;
 $('#ftBrand').textContent=main;$('#ftAlt').textContent=alt;
 document.title=main+' · '+T('doc_title');
 if(DB.brand.logo){$('#logoImg').src=DB.brand.logo;$('#logoImg').hidden=false;$('#logoSvg').style.display='none';}
 else{$('#logoImg').hidden=true;$('#logoSvg').style.display='';}}

/* ================= صحنه / پړاوونه ================= */
 $('#rays').innerHTML=Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;
 return`<line x1="${(210+47*Math.cos(a)).toFixed(1)}" y1="${(120+47*Math.sin(a)).toFixed(1)}" x2="${(210+61*Math.cos(a)).toFixed(1)}" y2="${(120+61*Math.sin(a)).toFixed(1)}"/>`;}).join('');
function setStage(i){
 state.stage=Math.max(0,Math.min(3,i));
 const st=DB.stages[state.stage],r=document.documentElement.style,f=[.08,.42,.72,1][state.stage];
 r.setProperty('--accent',st.color);r.setProperty('--accent-soft',st.soft);

function cartTotals(){
 const ids=Object.keys(state.cart).filter(id=>state.cart[id]>0);
 const sub=ids.reduce((a,id)=>{const p=DB.products.find(x=>x.id===id);return a+(p?p.price*state.cart[id]:0)},0);
 const fee=ids.length?(+DB.settings.deliveryFee||0):0;
 const disc=state.promo?Math.round(sub*state.promo.pct/100):0;
 return{ids,sub,fee,disc,total:Math.max(0,sub-disc)+fee};}
function renderCart(){
 const t=cartTotals();
 const count=t.ids.reduce((a,id)=>a+state.cart[id],0);
 const badge=$('#badge');badge.textContent=nf(count);badge.classList.toggle('show',count>0);
 if(!t.ids.length){$('#dBody').innerHTML=`<div class="d-empty"><svg class="ic"><use href="#i-basket"/></svg><p>${T('cart_empty')}</p></div>`;$('#dFoot').style.display='none';return;}
 $('#dFoot').style.display='';
 $('#dBody').innerHTML=t.ids.map(id=>{const p=DB.products.find(x=>x.id===id);if(!p)return'';const q=state.cart[id];return`
 <div class="d-item"><span class="d-fig">${pImgs(p)[0]?`<img src="${pImgs(p)[0]}" alt="">`:pkgSVG(p)}</span>
  <span><strong>${L(p.name)}</strong><span class="d-price">${fmt(p.price)}</span>
   <span class="qty"><button class="q-btn" data-q="-1" data-id="${id}"><svg class="ic"><use href="#i-minus"/></svg></button><b>${nf(q)}</b><button class="q-btn" data-q="1" data-id="${id}"><svg class="ic"><use href="#i-plus"/></svg></button></span></span>
  <button class="d-x" data-rm="${id}"><svg class="ic" style="width:14px;height:14px"><use href="#i-x"/></svg></button>
 </div>`}).join('');
 $('#dSub').textContent=fmt(t.sub);
 $('#dDiscRow').hidden=!t.disc;$('#dDisc').textContent='−'+fmt(t.disc);
 $('#dFee').textContent=t.fee?fmt(t.fee):T('free_t');
 $('#dTotal').textContent=fmt(t.total);}

function bindEdit(){
 const on=isAdmin()&&state.edit;
 $$('[data-e]').forEach(el=>{
  if(on){el.setAttribute('contenteditable','true');el.spellcheck=false;}
  else el.removeAttribute('contenteditable');});}
function saveEdit(key,v){
 const parts=key.split(':'),pp=parts[0],lg=state.lang;
 const set=(o,map,f)=>{const real=map[f]||f;if(!o[real]||typeof o[real]!=='object')o[real]={};o[real][lg]=v;};
 if(pp==='brand'){DB.brand[state.lang==='fa'?'nameFa':state.lang==='ps'?'namePs':'nameEn']=v;applyBrand();}
 else if(pp==='set'){
  if(parts[1]==='bar')DB.settings.bar[lg]=v,applySettings();
  else if(parts[1]==='addr')DB.settings.addr[lg]=v,applySettings();
  else DB.settings[parts[1]]=toEn(v).trim(),applySettings();}
 else if(pp==='p'){const it=DB.products.find(x=>x.id===parts[1]);if(!it)return;
  if(parts[2]==='price')it.price=Math.round(+toEn(v).replace(/[^\d.]/g,''))||0,renderCart();
  else set(it,{n:'name',t:'tag'},parts[2]);}
 else if(pp==='pn'){const it=DB.products.find(x=>x.id===parts[1]);if(!it)return;
  if(!Array.isArray(it.notes[lg]))it.notes[lg]=[...it.notes.en];
  if(it.notes[lg][+parts[2]]!=null)it.notes[lg][+parts[2]]=v;}
 else if(pp==='st'){const it=DB.stages[+parts[1]];set(it,{nm:'name',rg:'range',fd:'feed'},parts[2]);
  if(parts[2]==='rg'){buildChips();buildFilters();}}
 else if(pp==='stm'){const it=DB.stages[+parts[1]];
  if(!Array.isArray(it.milestones[lg]))it.milestones[lg]=[...it.milestones.en];
  it.milestones[lg][+parts[2]]=v;}
 else if(pp==='stf'){const it=DB.stages[+parts[1]];
  if(!Array.isArray(it.focus[lg]))it.focus[lg]=[...it.focus.en];
  it.focus[lg][+parts[2]]=v;}
 else if(pp==='sy'){const it=DB.stories[+parts[1]];set(it,{nm:'title',dk:'dek',mt:'meta'},parts[2]);}
 else if(pp==='syb'){const it=DB.stories[+parts[1]];
  if(!Array.isArray(it.body[lg]))it.body[lg]=[...it.body.en];
  it.body[lg][+parts[2]]=v;}
 else if(pp==='nu'){const it=DB.nutrients[+parts[1]];if(!it)return;
  if(parts[2]==='val')it.val=+toEn(v).replace(/[^\d.]/g,'')||0;
  else if(parts[2]==='pct')it.pct=Math.min(100,Math.max(0,+toEn(v).replace(/[^\d]/g,'')||0));
  else set(it,{nm:'name',ds:'desc'},parts[2]);
  updateRing();}
 else DB.texts[lg][key]=v;
 save();}
document.addEventListener('blur',e=>{
 const el=e.target.closest&&e.target.closest('[data-e]');
 if(!el||!state.edit||!isAdmin())return;
 const key=el.dataset.e;
 let v=el.innerText.trim().replace(/\s*\n\s*/g,' ');
 if(!v&&key==='brand')return;
 saveEdit(key,v);
 $$('[data-e="'+key+'"]').forEach(x=>{if(x!==el)x.innerText=v;});
},true);

/* ---- پینل پیښې ---- */
 $('#pBody').addEventListener('input',e=>{
 const el=e.target,k=el.dataset.k,pk=el.dataset.pk;
 if(!state.panel)return;
 if(k){
  if(k.startsWith('stage.')){const[,i,f]=k.split('.');
   DB.stages[+i][f]=el.value;applyTheme();buildChips();buildBand();buildFilters();renderShelf();setStage(state.stage);save();return;}
  const p=k.split('.');
  if(p[0]==='theme'){DB.theme[p[1]]=el.type==='range'?+el.value:el.value;applyTheme();}
  else if(p[0]==='set'){
   if(p[1]==='baren')DB.settings.bar.en=el.value;
   else if(p[1]==='barfa')DB.settings.bar.fa=el.value;
   else if(p[1]==='barps')DB.settings.bar.ps=el.value;
   else if(p[1]==='addren')DB.settings.addr.en=el.value;
   else if(p[1]==='addrfa')DB.settings.addr.fa=el.value;
   else if(p[1]==='addrps')DB.settings.addr.ps=el.value;
   else if(p[1]==='tgtoken'){DB.settings.telegram=DB.settings.telegram||{};DB.settings.telegram.token=el.value.trim();}
   else if(p[1]==='tgchat'){DB.settings.telegram=DB.settings.telegram||{};DB.settings.telegram.chat=el.value.trim();}
   else if(p[1]==='paykey'){DB.settings.pay=DB.settings.pay||{};DB.settings.pay.apiKey=el.value.trim();}
   else if(p[1]==='payend'){DB.settings.pay=DB.settings.pay||{};DB.settings.pay.endpoint=el.value.trim();}
   else DB.settings[p[1]]=p[1]==='deliveryFee'?Math.round(+toEn(el.value))||0:el.value;
   applySettings();}
  else if(p[0]==='cur'){DB.settings.currency[p[1]]=el.value;renderShelf();renderCart();}
  else if(p[0]==='brand'){DB.brand[p[1]]=el.value;applyBrand();}
  save();return;}
 if(pk){const[id,field]=pk.split('.');const it=DB.products.find(x=>x.id===id);if(!it)return;
  if(field==='price')it.price=Math.round(+toEn(el.value).replace(/[^\d.]/g,''))||0;
  else if(field==='stock')it.stock=el.value.trim()===''?null:Math.max(0,Math.round(+toEn(el.value))||0);
  else if(field==='stage')it.stage=+el.value;
  else if(field==='pkg')it.pkg=el.value;
  else{const lg=field.split('.')[1];if(lg)it[field.split('.')[0]][lg]=el.value;}
  if(['price','stock','stage','pkg'].includes(field))renderShelf();
  if(['price','stock'].includes(field))renderCart();
  if(['name','tag'].includes(field.split('.')[0]))renderShelf();
  save();}
});
 $('#pBody').addEventListener('change',e=>{
 const el=e.target,pk=el.dataset.pk;
 if(!pk)return;
 const[id,field]=pk.split('.');
 if(['stage','pkg'].includes(field)){const it=DB.products.find(x=>x.id===id);
  if(it){it[field]=field==='stage'?+el.value:el.value;save();renderShelf();}}
});
 $('#pBody').addEventListener('click',e=>{
 const sw=e.target.closest('[data-sw]');
 if(sw){const k=sw.dataset.sw,p=k.split('.');
  if(p[0]==='theme'){DB.theme[p[1]]=!DB.theme[p[1]];applyTheme();}
  else if(p[0]==='show'){DB.settings.show[p[1]]=!DB.settings.show[p[1]];applySettings();}
  else if(p[0]==='set'&&p[1]==='pay'){DB.settings.pay=DB.settings.pay||{};DB.settings.pay.enabled=!DB.settings.pay.enabled;}
  sw.classList.toggle('on');save();return;}
 const os=e.target.closest('[data-ost]');
 if(os){const[id,k]=os.dataset.ost.split(':');api('order-status',{id,status:k}).then(()=>openPanel('orders'));return;}
 const od=e.target.closest('[data-odel]');
 if(od){api('order-delete',{id:od.dataset.odel}).then(()=>openPanel('orders'));return;}
 const cd=e.target.closest('[data-cdel]');
 if(cd){api('consult-del',{t:cd.dataset.cdel}).then(()=>openPanel('msgs'));return;}
 const sd=e.target.closest('[data-sdel]');
 if(sd){api('subs-del',{email:sd.dataset.sdel}).then(()=>openPanel('msgs'));return;}
 const b=e.target.closest('[data-do]');if(!b)return;
 const[act,arg]=b.dataset.do.split(':');
 if(act==='pimg')pickImg(d=>{const it=DB.products.find(x=>x.id===arg);if(it)it.img=d;save();renderShelf();openPanel('products');});
 else if(act==='pimgdel'){const it=DB.products.find(x=>x.id===arg);if(it)it.img=null;save();renderShelf();openPanel('products');}
 else if(act==='gadd')pickImg(d=>{const it=DB.products.find(x=>x.id===arg);it.imgs=it.imgs||[];it.imgs.push(d);save();renderShelf();openPanel('products');toast('عکس گالري ته ورزیافه شو');});
 else if(act==='gdel'){const[pid,gix]=arg.split(':');const it=DB.products.find(x=>x.id===pid);
  if(it&&it.imgs){it.imgs.splice(+gix,1);save();renderShelf();openPanel('products');}}
 else if(act==='addprod'){DB.products.push({id:'p'+Date.now(),pkg:'box',stage:1,price:0,stock:20,plabel:'NEW',tilt:0,img:null,imgs:[],
   name:{en:'New product',fa:'محصول جدید',ps:'نوی توکی'},tag:{en:'Tagline',fa:'توضیح',ps:'لنډه پیغام'},
   notes:{en:['Note 1'],fa:['یادداشت ۱'],ps:['یادداشت ۱']}});
  save();renderShelf();buildFilters();openPanel('products');toast('محصول اضافه شد');}
 else if(act==='delprod'){
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='مطمئنی؟ دوباره بزن';setTimeout(()=>{b.classList.remove('armed');b.textContent='حذف'},2500);return;}
  DB.products=DB.products.filter(x=>x.id!==arg);if(state.cart[arg])delete state.cart[arg];
  save();renderShelf();renderCart();buildFilters();openPanel('products');toast('حذف شد');}
 else if(act==='addpromo'){DB.settings.promos=DB.settings.promos||[];DB.settings.promos.push({code:'CODE'+(DB.settings.promos.length+1),pct:10});save();openPanel('products');}
 else if(act==='delpromo'){DB.settings.promos.splice(+arg,1);save();if(state.promo)state.promo=null;renderCart();openPanel('products');}
 else if(act==='logo')pickImg(d=>{DB.brand.logo=d;save();applyBrand();openPanel('brand');});
 else if(act==='logodel'){DB.brand.logo=null;save();applyBrand();openPanel('brand');}
 else if(act==='hero')pickImg(d=>{DB.settings.heroImg=d;save();applySettings();openPanel('brand');});
 else if(act==='herodel'){DB.settings.heroImg=null;save();applySettings();openPanel('brand');}
 else if(act==='export')location.href='/api/export';
 else if(act==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
   r.onload=async()=>{try{const j=await api('import',{site:JSON.parse(r.result)});
    if(j.ok){toast('بازیابی شد — بارگذاری مجدد…');setTimeout(()=>location.reload(),700);}
    else toast('فایل نامعتبر است',false);}catch(err){toast('فایل نامعتبر است',false);}};r.readAsText(f);};i.click();}
 else if(act==='reset'){
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='مطمئنی؟ دوباره بزن';setTimeout(()=>{b.classList.remove('armed');b.textContent='بازنشانی کامل'},2500);return;}
  api('reset',{}).then(()=>location.reload());}
 else if(act==='pass'){api('password',{cur:$('#pwCur').value,new:$('#pwNew').value}).then(j=>{
  if(j.ok){$('#pwCur').value='';$('#pwNew').value='';toast('رمز عوض شد ✓');}
  else toast(j.error==='wrong'?'رمز فعلی درست نیست':j.error==='short'?'رمز جدید کوتاه است':'خطا',false);});}
});
 $('#pBody').addEventListener('change',e=>{
 if(e.target.classList.contains('pcode')){DB.settings.promos[+e.target.dataset.i].code=e.target.value.trim().toUpperCase();save();}
 if(e.target.classList.contains('ppct')){DB.settings.promos[+e.target.dataset.i].pct=Math.min(90,Math.max(1,+toEn(e.target.value)||10));save();renderShelf();}
});

function showLogin(){$('#login').classList.add('open');document.body.classList.add('locked');$('#pw').focus();}
function hideLogin(){$('#login').classList.remove('open');document.body.classList.remove('locked');$('#pwErr').style.display='none';$('#pw').value='';}
 $('#loginForm').addEventListener('submit',async e=>{

 try{const j=await api('login',{pw:$('#pw').value});
  if(j.ok){location.reload();return;}
  $('#pwErr').textContent=j.error==='wait'?'ډېرې هڅې — ۱۰ دقیقې وروسته':j.error==='wrong'?'رمز سمه نه ده':'خطا';
 }catch(err){$('#pwErr').textContent='سرور ته لاسرسی نشته';}
 $('#pwErr').style.display='block';});

 $('#ftAdmin').addEventListener('click',()=>isAdmin()?openPanel('data'):showLogin());
 $('#lgClose').addEventListener('click',hideLogin);
 $('#login').addEventListener('click',e=>{if(e.target.id==='login')hideLogin();});
 $('#logoutBtn').addEventListener('click',async()=>{

 $('#editBtn').addEventListener('click',()=>{
 state.edit=!state.edit;document.body.classList.toggle('editing',state.edit);
 $('#editBtn').classList.toggle('on',state.edit);bindEdit();
 if(state.edit)toast('اېډیټ: هر متن کېکاږه او ولیکه — په خپله سرور ته سیو کیږي');});

 $('#admClose').addEventListener('click',closePanel);

/* ================= ډېري اړیکې ================= */
 $('#stageChips').addEventListener('click',e=>{const c=e.target.closest('.s-chip');if(c)setStage(+c.dataset.i);});
 $('#band').addEventListener('click',e=>{const s=e.target.closest('.seg');if(s)setStage(+s.dataset.i);});
 $('#filters').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
 state.filter=c.dataset.f;$$('#filters .chip').forEach(x=>x.classList.toggle('active',x===c));renderShelf();});
 $('#searchIn').addEventListener('input',e=>{state.search=e.target.value;renderShelf();});
const shelfDir=()=>document.documentElement.dir==='rtl'?-1:1;
 $('#shelfNext').addEventListener('click',()=>$('#shelf').scrollBy({left:300*shelfDir(),behavior:'smooth'}));
 $('#shelfPrev').addEventListener('click',()=>$('#shelf').scrollBy({left:-300*shelfDir(),behavior:'smooth'}));
 $('#shelf').addEventListener('click',e=>{
 const gi=e.target.closest('[data-gal]');if(gi){openGal(gi.dataset.gal);return;}
 const b=e.target.closest('[data-add]');if(!b)return;
 const id=b.dataset.add,p=DB.products.find(x=>x.id===id);if(!p)return;
 if(p.stock!=null&&(state.cart[id]||0)>=p.stock){toast(T('outstock'),false);return;}
 state.cart[id]=(state.cart[id]||0)+1;renderCart();
 const badge=$('#badge');badge.classList.remove('bump');void badge.offsetWidth;badge.classList.add('bump');
 toast(`${T('t_added')} — ${L(p.name)}`);});
 $('#cartBtn').addEventListener('click',()=>{$('#cartDrawer').classList.add('open');$('#scrim').classList.add('on');document.body.classList.add('locked');});
function closeCart(){$('#cartDrawer').classList.remove('open');$('#scrim').classList.remove('on');document.body.classList.remove('locked');}
 $('#dClose').addEventListener('click',closeCart);
 $('#scrim').addEventListener('click',()=>{closeCart();closePanel();});
 $('#dBody').addEventListener('click',e=>{
 const q=e.target.closest('[data-q]');
 if(q){const id=q.dataset.id,p=DB.products.find(x=>x.id===id);
  state.cart[id]=Math.max(0,(state.cart[id]||0)+ +q.dataset.q);
  if(p&&p.stock!=null&&state.cart[id]>p.stock)state.cart[id]=p.stock;
  if(!state.cart[id])delete state.cart[id];renderCart();return;}
 const r=e.target.closest('[data-rm]');if(r){delete state.cart[r.dataset.rm];renderCart();}});
 $('#nList').addEventListener('click',e=>{const r=e.target.closest('.n-row');if(!r)return;
 state.nutrient=+r.dataset.n;
 $$('.n-row').forEach(x=>x.classList.toggle('active',x===r));updateRing();});
const peek=$('#peek'),peekUse=$('#peekUse');
let px=0,py=0,tx=0,ty=0;
if(matchMedia('(pointer:fine)').matches){
 document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
 (function loop(){px+=(tx-px)*.16;py+=(ty-py)*.16;
  peek.style.left=(px+26)+'px';peek.style.top=(py-100)+'px';requestAnimationFrame(loop);})();}
 $('#storyList').addEventListener('mouseover',e=>{const r=e.target.closest('.story-row');if(!r)return;
 const s=DB.stories[+r.dataset.s];peekUse.setAttribute('href',s.icon);
 peek.style.setProperty('--pc',s.color);peek.style.setProperty('--pb',s.soft);peek.classList.add('on');});
 $('#storyList').addEventListener('mouseleave',()=>peek.classList.remove('on'));
 $('#storyList').addEventListener('click',e=>{const r=e.target.closest('.story-row');if(!r)return;
 const i=+r.dataset.s,s=DB.stories[i];
 $('#rdK').textContent=`${brandMain()} · ${L(s.meta)}`;
 $('#rdT').textContent=L(s.title);
 $('#rdB').innerHTML=Ar(s.body).map((p,j)=>`<p data-e="syb:${i}:${j}">${p}</p>`).join('');
 $('#reader').classList.add('open');document.body.classList.add('locked');bindEdit();});
function closeReader(){$('#reader').classList.remove('open');if(!$('#cartDrawer').classList.contains('open')&&!$('#admDrawer').classList.contains('open'))document.body.classList.remove('locked');}
 $('#rdClose').addEventListener('click',closeReader);
 $('#reader').addEventListener('click',e=>{if(e.target.id==='reader')closeReader();});
 $$('[data-legal]').forEach(b=>b.addEventListener('click',()=>{
 const o=DB.legal[b.dataset.legal];
 $('#rdK').textContent=brandMain()+' · 2025';
 $('#rdT').textContent=L(o.title);
 $('#rdB').innerHTML=o.paras.map(p=>`<p>${L(p)}</p>`).join('');
 $('#reader').classList.add('open');document.body.classList.add('locked');}));
 $$('[data-mclose]').forEach(b=>b.addEventListener('click',()=>{
 const m=document.getElementById(b.dataset.mclose);m.classList.remove('open');
 if(!$('.modal.open')&&!$('.drawer.open'))document.body.classList.remove('locked');}));

/* ================= چیکاوټ ================= */
 $('#dCheckout').addEventListener('click',()=>{
 const t=cartTotals();if(!t.ids.length)return;
 $('#ckList').innerHTML=t.ids.map(id=>{const p=DB.products.find(x=>x.id===id);
  return`<div class="c-row"><span>${L(p.name)} × ${nf(state.cart[id])}</span><b>${fmt(p.price*state.cart[id])}</b></div>`;}).join('');
 $('#ckOnlineWrap').hidden=!((DB.settings.pay||{}).enabled&&(DB.settings.pay||{}).apiKey);
 const cash=document.querySelector('input[name=pay][value=cash]');if(cash)cash.checked=true;
 syncCkTotals();
 $('#ckForm').hidden=false;$('#ckOk').hidden=true;
 $('#checkout').classList.add('open');document.body.classList.add('locked');});
function syncCkTotals(){
 const t=cartTotals();
 $('#ckSub').textContent=fmt(t.sub);
 $('#ckDiscRow').hidden=!t.disc;$('#ckDisc').textContent='−'+fmt(t.disc);
 $('#ckFee').textContent=t.fee?fmt(t.fee):T('free_t');
 $('#ckTot').textContent=fmt(t.total);}
 $('#ckPromoBtn').addEventListener('click',async()=>{
 const code=$('#ckPromo').value.trim();
 if(!code)return;
 const j=await api('promo',{code,sub:cartTotals().sub});
 if(j.ok){state.promo={code:j.code,pct:j.pct};toast(T('promo_ok'));}
 else{state.promo=null;toast(T('promo_bad'),false);}
 syncCkTotals();renderCart();});
 $('#ckForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const t=cartTotals();
 if(!t.ids.length)return;
 const payM=document.querySelector('input[name=pay]:checked').value;
 const j=await api('order',{items:t.ids.map(id=>({id,qty:state.cart[id]})),pay:payM,
  promo:state.promo?state.promo.code:null,
  customer:{name:$('#ck_name').value,phone:$('#ck_phone').value,addr:$('#ck_addr').value,note:$('#ck_note').value}});
 if(!j.ok){toast(T('ck_err'),false);return;}
 const qtySnap={...state.cart};
 const msg=[`${brandMain()} — ${j.id}`,
  `${T('ck_name')}: ${$('#ck_name').value}`,`${T('ck_phone')}: ${$('#ck_phone').value}`,
  `${T('ck_addr')}: ${$('#ck_addr').value}`,
  $('#ck_note').value?`${T('ck_note')}: ${$('#ck_note').value}`:'','———',
  ...t.ids.map(id=>{const p=DB.products.find(x=>x.id===id);return`${L(p.name)} × ${qtySnap[id]} = ${fmt(p.price*qtySnap[id])}`;}),
  t.disc?`${T('disc_t')}: −${fmt(t.disc)} (${state.promo.code})`:'',
  `${T('del_t')}: ${t.fee?fmt(t.fee):T('free_t')}`,
  `${T('cart_total')}: ${fmt(j.total)}`,
  `${T('ck_pay')}: ${T(payM==='bank'?'ck_bank':payM==='online'?'ck_online':'ck_cash')}`
 ].filter(Boolean).join('\n');
 $('#wsBtn').href='https://wa.me/'+intlPhone(DB.settings.whatsapp)+'?text='+encodeURIComponent(msg);
 if(j.payUrl){$('#payNow').href=j.payUrl;$('#payNow').hidden=false;}else $('#payNow').hidden=true;
 $('#ckCode').textContent=j.id;$('#ckTrackCode').textContent=j.id;
 $('#ckForm').hidden=true;$('#ckOk').hidden=false;
 t.ids.forEach(id=>{const p=DB.products.find(x=>x.id===id);if(p&&p.stock!=null)p.stock=Math.max(0,p.stock-(qtySnap[id]||0));});
 state.cart={};state.promo=null;$('#ckPromo').value='';
 renderShelf();renderCart();toast(T('t_order'));});

/* ================= تعقیب ================= */
function openTrack(){$('#trackOut').innerHTML='';$('#trackIn').value='';
 $('#trackModal').classList.add('open');document.body.classList.add('locked');$('#trackIn').focus();}
 $('#trackBtn').addEventListener('click',openTrack);
 $('#trackLink').addEventListener('click',openTrack);
 $('#trackGo').addEventListener('click',async()=>{
 const code=$('#trackIn').value.trim();
 if(!code)return;
 const st={new:['st_new','#C96F4A'],conf:['st_conf','#D9A441'],done:['st_done','#8A9B6E'],cxl:['st_cxl','#9a9a9a']};
 try{const j=await api('track?code='+encodeURIComponent(code),null,'GET');
  if(!j.ok){$('#trackOut').innerHTML=`<p class="pn-note">${T('track_none')}</p>`;return;}
  $('#trackOut').innerHTML=`<div style="text-align:center;padding:10px 0">
   <b style="font:700 26px var(--fd)">${j.id}</b><br><br>
   <span class="st-chip" style="background:${st[j.status][1]};color:#fff">${T(st[j.status][0])}</span><br><br>
   <span style="color:var(--ink-60);font-size:14px">${new Date(j.time).toLocaleString('fa-AF')} · ${fmt(j.total)}</span></div>`;
 }catch(e){$('#trackOut').innerHTML=`<p class="pn-note">${T('track_none')}</p>`;}});
 $('#trackIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#trackGo').click();});

/* ================= ګالري لایت‌باکس ================= */
let gal={list:[],i:0};
function openGal(id){const p=DB.products.find(x=>x.id===id);const list=pImgs(p);
 if(!list.length)return;gal={list,i:0};showGal();
 $('#lightbox').classList.add('open');document.body.classList.add('locked');}
function showGal(){$('#lbImg').src=gal.list[gal.i];$('#lbCount').textContent=nf(gal.i+1)+' / '+nf(gal.list.length);}
function closeGal(){$('#lightbox').classList.remove('open');document.body.classList.remove('locked');}
 $('#lbPrev').addEventListener('click',()=>{gal.i=(gal.i-1+gal.list.length)%gal.list.length;showGal();});
 $('#lbNext').addEventListener('click',()=>{gal.i=(gal.i+1)%gal.list.length;showGal();});
 $('#lbClose').addEventListener('click',closeGal);
 $('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeGal();});
document.addEventListener('keydown',e=>{
 if(!$('#lightbox').classList.contains('open'))return;
 if(e.key==='ArrowRight')$('#lbNext').click();
 if(e.key==='ArrowLeft')$('#lbPrev').click();});

/* ================= فورمې ================= */
 $('#careForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const name=$('#f_name'),phone=$('#f_phone');
 const okN=name.value.trim().length>=2,okP=phone.value.replace(/\D/g,'').length>=8;
 name.closest('.f-field').classList.toggle('invalid',!okN);
 phone.closest('.f-field').classList.toggle('invalid',!okP);
 if(!okN||!okP)return;
 try{const j=await api('consult',{name:name.value,phone:phone.value,
   age:$('#f_age').options[$('#f_age').selectedIndex].text,
   topic:$('#f_topic').options[$('#f_topic').selectedIndex].text,msg:$('#f_msg').value});
  if(!j.ok)throw 0;
  $('#careForm').hidden=true;$('#careOk').hidden=false;toast(T('t_form'));
 }catch(err){toast(T('t_form'));}});
['f_name','f_phone'].forEach(id=>$('#'+id).addEventListener('input',e=>e.target.closest('.f-field').classList.remove('invalid')));
 $('#againBtn').addEventListener('click',()=>{$('#careForm').reset();$('#careForm').hidden=false;$('#careOk').hidden=true;});
 $('#nlForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const v=$('#nlMail').value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){toast(T('t_news_err'),false);return;}
 try{await api('subscribe',{email:v});}catch(err){}
 $('#nlMail').value='';toast(T('t_news'));});

/* ================= ژبه ================= */
function setLang(l){
 state.lang=l;localStorage.setItem('nbn_lang',l);
 document.documentElement.lang=l;
 document.documentElement.dir=l==='en'?'ltr':'rtl';
 $('#langName').textContent=LANG_NAME[l];
 $$('#langMenu button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
 renderAll();}
 $('#langBtn').addEventListener('click',e=>{e.stopPropagation();$('#langMenu').classList.toggle('open');});
 $$('#langMenu button').forEach(b=>b.addEventListener('click',()=>{setLang(b.dataset.lang);$('#langMenu').classList.remove('open');}));
document.addEventListener('click',()=>$('#langMenu').classList.remove('open'));

/* ================= هډر/ناو ================= */
addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>8),{passive:true});
 $('#menuBtn').addEventListener('click',()=>$('#nav').classList.toggle('open'));
 $$('#nav a').forEach(a=>a.addEventListener('click',()=>$('#nav').classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
 hideLogin();closeReader();closeCart();closePanel();closeGal();
 $$('.modal.open').forEach(m=>{if(!['reader','login','lightbox'].includes(m.id))m.classList.remove('open')});
 $('#nav').classList.remove('open');$('#langMenu').classList.remove('open');
 if(!$('.drawer.open')&&!$('.modal.open'))document.body.classList.remove('locked');});
const secIO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)
 $$('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-45% 0px -50% 0px'});
['stages','products','nutrition','stories','care'].forEach(id=>secIO.observe(document.getElementById(id)));
const rvIO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('rv-in');rvIO.unobserve(en.target);}}),{threshold:.12});
window.addEventListener('beforeunload',()=>{if($('#saveState')&&$('#saveState').classList.contains('dirty'))doSave();});

 if(qp.get('payok')){const st=qp.get('st');
